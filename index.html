<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>English Valley · 하얀 새의 영어 여행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#140f33;color:#fff;
  font-family:'Gowun Dodum','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
input{font-family:inherit}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}

/* ---------- 로그인 ---------- */
#login{background:linear-gradient(160deg,#2b1f63 0%,#5b3fa0 45%,#d98fb8 100%);overflow:hidden}
#login .orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;animation:float 14s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-40px)}}
.loginWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:min(460px,94vw);padding:30px 30px 24px;border-radius:28px;background:rgba(255,255,255,.14);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.35);
  box-shadow:0 20px 60px rgba(20,10,60,.45)}
.logo{font-size:44px;text-align:center;letter-spacing:2px;text-shadow:0 4px 24px rgba(255,255,255,.5)}
.logoSub{text-align:center;opacity:.9;margin:6px 0 22px;font-size:16px}
.row{display:flex;gap:10px;margin-bottom:12px}
.row label{flex:1;font-size:13px;opacity:.9}
.row input{width:100%;margin-top:4px;padding:12px 14px;border-radius:14px;border:2px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.18);color:#fff;font-size:18px;outline:none}
.row input::placeholder{color:rgba(255,255,255,.55)}
.row input:focus{border-color:#fff;background:rgba(255,255,255,.28)}
.bigBtn{width:100%;padding:15px;border-radius:18px;font-size:20px;background:linear-gradient(135deg,#fff,#ffd6ea);
  color:#5b2a86;box-shadow:0 8px 24px rgba(255,200,230,.45);margin-top:6px;transition:transform .15s}
.bigBtn:active{transform:scale(.97)}
.linkRow{display:flex;justify-content:center;margin-top:14px;gap:14px}
.tiny{background:transparent;font-size:13px;opacity:.75;text-decoration:underline}
.tiny:hover{opacity:1}
.err{color:#ffd1d9;text-align:center;font-size:14px;min-height:20px;margin-top:8px}

/* ---------- 게임 ---------- */
#game{background:#140f33}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:absolute;left:0;right:0;top:0;padding:10px 14px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
.pill{background:rgba(20,12,50,.38);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.28);
  border-radius:18px;padding:8px 16px}
#roster{position:absolute;right:14px;top:58px;z-index:5;max-width:210px;max-height:46%;overflow:auto;background:rgba(30,20,70,.55);color:#fff;border-radius:14px;padding:8px 12px;font-size:12px;cursor:pointer;backdrop-filter:blur(4px)}
#roster b{font-size:13px}
#roster .rl{display:flex;flex-direction:column;gap:3px;margin-top:6px}
#roster .rl span{opacity:.75}
#roster .rl span.same{opacity:1;color:#ffe9a8}
#roster .rl span.me{opacity:1;color:#ffd65a;font-weight:700}
#mapTitle{font-size:18px;line-height:1.2}
#mapTitle small{display:block;font-size:12px;opacity:.8;margin-top:2px}
#dots{display:flex;gap:8px;align-items:center;padding:10px 16px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.8);background:transparent;transition:all .4s}
.dot.on{background:#ff7d9a;border-color:#ffd0da;box-shadow:0 0 12px #ff7d9a}
#hudR{display:flex;gap:8px}
#dots{gap:10px}
.lvb{font-size:15px;padding:2px 10px;border-radius:12px;background:linear-gradient(135deg,#ffe99a,#ffbf3b);color:#7a4a00;box-shadow:0 0 12px rgba(255,210,80,.6);margin-right:4px;letter-spacing:.5px}
.gem{width:15px;height:15px;transform:rotate(45deg);border:2px solid rgba(255,255,255,.75);border-radius:3px;transition:all .4s}
.gem.on{background:linear-gradient(135deg,#fff6b8,#ffcf3d 55%,#e59a0c);border-color:#ffe9a0;box-shadow:0 0 12px #ffd24a}
.gem.pop{animation:gpop .7s}
@keyframes gpop{0%{transform:rotate(45deg) scale(1)}35%{transform:rotate(225deg) scale(1.9)}100%{transform:rotate(45deg) scale(1)}}
#lvup{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.5);text-align:center;opacity:0;pointer-events:none;z-index:9;
  font-size:54px;letter-spacing:3px;background:linear-gradient(180deg,#fffbe0,#ffd23d 60%,#f09a0c);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 14px rgba(255,190,40,.7)) drop-shadow(0 2px 0 rgba(120,70,0,.6))}
#lvup small{display:block;font-size:20px;letter-spacing:6px;opacity:.95;margin-bottom:2px}
#lvup.on{animation:lvu 2s ease-out forwards}
@keyframes lvu{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.ib{width:42px;height:42px;border-radius:50%;font-size:18px;background:rgba(20,12,50,.38);border:1px solid rgba(255,255,255,.28);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ib.txt{width:auto;border-radius:18px;padding:0 14px;font-size:13px}
#prev{position:absolute;left:14px;top:74px;display:none;gap:6px;z-index:5}
#prev.on{display:flex}
#prev button{padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.2);font-size:13px}
#hint{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);padding:12px 22px;border-radius:20px;
  background:rgba(20,12,50,.45);backdrop-filter:blur(8px);font-size:17px;opacity:0;transition:opacity .8s;pointer-events:none;z-index:4;text-align:center}
#hint.on{opacity:1}
#toast{position:absolute;left:50%;top:22%;transform:translate(-50%,0);padding:12px 26px;border-radius:22px;font-size:22px;
  background:rgba(255,255,255,.88);color:#5b2a86;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:all .5s;z-index:8}
#toast.on{opacity:1;transform:translate(-50%,-10px)}

/* ---------- 문제 ---------- */
#qOv{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,8,45,.55);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:10;padding:14px}
#qOv.on{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
#qCard{width:min(760px,96vw);padding:26px 28px 22px;border-radius:28px;background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(255,235,247,.93));
  color:#3a2468;box-shadow:0 24px 70px rgba(10,0,40,.55);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85) translateY(20px);opacity:0}to{transform:none;opacity:1}}
#qTag{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.chip{padding:4px 12px;border-radius:999px;font-size:13px;background:#ffd3e4;color:#a3306a}
.chip.b{background:#d9d2ff;color:#4b3a9a}
#qKo{font-size:15px;color:#7a6aa8;margin-bottom:6px}
#qText{font-size:28px;line-height:1.35;margin-bottom:18px;white-space:pre-line;font-weight:700}
#qOpts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){#qOpts{grid-template-columns:1fr}#qText{font-size:22px}}
.opt{padding:16px 16px;border-radius:18px;background:#fff;border:3px solid #e1d6ff;font-size:21px;color:#3a2468;text-align:left;
  display:flex;gap:10px;align-items:center;transition:all .15s;box-shadow:0 4px 0 #e1d6ff}
.opt b{display:inline-flex;width:30px;height:30px;border-radius:50%;background:#e9e1ff;align-items:center;justify-content:center;font-size:16px;flex:none}
.opt:hover{border-color:#b39bff;transform:translateY(-2px)}
.opt:active{transform:translateY(2px);box-shadow:none}
.opt.dead{opacity:.35;text-decoration:line-through;pointer-events:none;background:#f1edf8}
#qFoot{margin-top:12px;font-size:13px;color:#8c7cb8;text-align:right;min-height:18px}

/* ---------- 컷신 ---------- */
#cut{position:absolute;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:30;flex-direction:column}
#cut.on{display:flex}
#cutV{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#000}
#cutCard{position:relative;text-align:center;padding:20px;animation:fade 1.2s}
#cutCard h1{font-size:min(9vw,56px);letter-spacing:3px;text-shadow:0 0 30px rgba(255,255,255,.7)}
#cutCard p{font-size:min(4.4vw,20px);opacity:.9;margin-top:14px;line-height:1.7;white-space:pre-line}
#cutCard .m{font-size:14px;letter-spacing:6px;opacity:.7;margin-bottom:10px}
#cutSkip{position:absolute;right:18px;bottom:18px;padding:8px 16px;border-radius:14px;background:rgba(255,255,255,.2);font-size:14px;z-index:2}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20;transition:opacity 1.2s}

/* ---------- 엔딩 ---------- */
#end{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.0);z-index:25;padding:16px}
#end.on{display:flex}
#endCard{max-width:560px;text-align:center;padding:30px;border-radius:30px;background:rgba(255,255,255,.88);color:#3a2468;box-shadow:0 20px 60px rgba(90,60,160,.35);animation:pop .8s}
#endCard h1{font-size:36px;margin-bottom:10px}
#endCard p{line-height:1.8;font-size:18px;margin-bottom:6px}
#endCard .btns{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
#endCard .btns button{padding:12px 22px;border-radius:16px;font-size:17px;background:#6c4bd1;color:#fff}
#endCard .btns button.g{background:#e6dcff;color:#4b3a9a}

/* ---------- 교사용 ---------- */
#teacher{background:#f4f1fb;color:#2f2457;overflow:auto;user-select:text;-webkit-user-select:text}
.tWrap{max-width:1250px;margin:0 auto;padding:20px 22px 60px}
.tHead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.tHead h1{font-size:26px}
.tBtns{display:flex;gap:8px;flex-wrap:wrap}
.tb{padding:9px 16px;border-radius:12px;background:#6c4bd1;color:#fff;font-size:14px}
.tb.g{background:#e3dbf7;color:#443083}
.tb.r{background:#e8587a}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.sumC{background:#fff;border-radius:18px;padding:14px 18px;box-shadow:0 4px 14px rgba(90,60,160,.1)}
.sumC small{color:#8a7cb5;font-size:13px}
.sumC div{font-size:28px;margin-top:2px}
.tBox{background:#fff;border-radius:20px;padding:6px 8px;box-shadow:0 4px 14px rgba(90,60,160,.1);margin-bottom:18px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:#f0eafc;color:#5a4a96;padding:9px 8px;font-weight:700;position:sticky;top:0;text-align:center}
td{padding:7px 8px;border-bottom:1px solid #eee9f8;text-align:center;white-space:nowrap}
td.nm{text-align:left;font-weight:700}
.cells{display:inline-flex;gap:2px;margin:0 4px}
.cells i{display:block;width:7px;height:20px;border-radius:3px;background:#e5dff3}
.cells i.f{background:#4fcf9b}
.cells i.s{background:#f6c256}
.cells i.t{background:#f6a0a8}
.cells.g{margin-right:9px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;background:#e8e1fb;color:#4b3a9a}
.badge.on{background:#cdf5e3;color:#13744b}
.badge.fin{background:#ffe3a8;color:#8a5a00}
.on-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ccc;margin-right:6px}
.on-dot.y{background:#2fd08b;box-shadow:0 0 8px #2fd08b}
.qStat{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;padding:10px}
.qs{background:#faf8ff;border-radius:12px;padding:8px 12px;font-size:13px}
.qs .bar{height:8px;background:#e6dff5;border-radius:6px;margin-top:6px;overflow:hidden}
.qs .bar i{display:block;height:100%;background:linear-gradient(90deg,#7e5be0,#ff8fb8)}
.legend{font-size:12px;color:#7a6cab;padding:6px 10px 10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin:0 4px 0 12px;vertical-align:-1px}
#pwOv{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,10,50,.6);z-index:40}
#pwOv.on{display:flex}
#pwCard{background:#fff;color:#3a2468;border-radius:22px;padding:24px 26px;width:min(340px,90vw);text-align:center}
#pwCard input{width:100%;padding:12px;font-size:22px;text-align:center;border-radius:12px;border:2px solid #cfc3f3;margin:12px 0;letter-spacing:6px}
#pwCard .btns{display:flex;gap:8px}
#pwCard .btns button{flex:1;padding:11px;border-radius:12px;background:#6c4bd1;color:#fff;font-size:16px}
#pwCard .btns button.g{background:#e3dbf7;color:#443083}
#pwErr{color:#d6385f;font-size:13px;min-height:18px}

#trans{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;pointer-events:none;overflow:hidden}
#trans.on{display:flex}
#trV{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;display:none}
#trans.vid #trV{display:block}
#trans.vid #trS{display:none}
#trans.vid::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(10,5,40,.35),rgba(10,5,40,.1) 70%);z-index:-1}
#cut.vid #cutCard{position:absolute;left:0;right:0;bottom:11%;text-shadow:0 2px 14px rgba(0,0,0,.7)}
#trans.in{animation:trIn .85s cubic-bezier(.6,0,.3,1) forwards}
#trans.out{animation:trOut .8s ease-in forwards}
@keyframes trIn{from{clip-path:circle(0% at 50% 55%)}to{clip-path:circle(150% at 50% 55%)}}
@keyframes trOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.08)}}
#trM{font-size:20px;letter-spacing:6px;opacity:0;animation:trTx .7s .5s forwards}
#trH{font-size:min(10vw,64px);margin:6px 0;text-shadow:0 0 30px rgba(255,255,255,.6);opacity:0;animation:trTx .8s .65s forwards}
#trP{font-size:20px;opacity:0;animation:trTx .8s .85s forwards}
#trans.out #trM,#trans.out #trH,#trans.out #trP{animation:none;opacity:1}
@keyframes trTx{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#trS i{position:absolute;font-style:normal;color:#fff;opacity:0;animation:trSt 2s infinite}
@keyframes trSt{0%{opacity:0;transform:translateY(10px) scale(.6)}50%{opacity:.9}100%{opacity:0;transform:translateY(-24px) scale(1.1)}}
#scn{position:fixed;inset:0;z-index:40;display:none;background:#0b0726}
#scn.on{display:block}
#scn canvas{width:100%;height:100%;display:block}
#scnSkip{position:absolute;right:18px;bottom:18px;padding:8px 16px;border-radius:14px;background:rgba(255,255,255,.2);color:#fff;font-size:14px}
</style>
</head>
<body>

<!-- ================= 로그인 ================= -->
<div id="login" class="screen on">
  <div class="orb" style="width:340px;height:340px;background:#8be3d0;left:-80px;top:-60px"></div>
  <div class="orb" style="width:420px;height:420px;background:#ff9ec6;right:-120px;bottom:-100px;animation-delay:-5s"></div>
  <div class="orb" style="width:260px;height:260px;background:#a89bff;right:20%;top:8%;animation-delay:-9s"></div>
  <div class="loginWrap">
    <div class="card">
      <div class="logo">English Valley</div>
      <div class="logoSub">물음표를 찾아 영어 문제를 풀고,<br>하얀 새가 되어 날아가 보세요 ✦</div>
      <div class="row">
        <label>반<input id="inBan" type="number" inputmode="numeric" min="1" max="30" placeholder="예: 3"></label>
        <label>번호<input id="inNum" type="number" inputmode="numeric" min="1" max="40" placeholder="예: 12"></label>
      </div>
      <div class="row"><label>이름<input id="inName" type="text" maxlength="10" placeholder="이름을 써 주세요" autocomplete="off"></label></div>
      <button class="bigBtn" id="btnStart">여행 시작하기</button>
      <div class="err" id="loginErr"></div>
      <div class="linkRow"><button class="tiny" id="btnToTeacher">교사용</button></div>
    </div>
  </div>
</div>

<!-- ================= 게임 ================= -->
<div id="game" class="screen">
  <canvas id="cv"></canvas>
  <div id="roster" style="display:none"></div>
  <div id="hud">
    <div class="pill" id="mapTitle">MAP 1<small>새벽의 정원</small></div>
    <div class="pill" id="dots"></div>
    <div id="hudR">
      <button class="ib" id="btnSnd" title="소리">🔊</button>
      <button class="ib txt" id="btnTeacherG">교사용</button>
      <button class="ib" id="btnHome" title="처음으로">⌂</button>
    </div>
  </div>
  <div id="prev"></div>
  <div id="hint"></div>
  <div id="toast"></div>
  <div id="lvup"><small>LEVEL UP!</small><span id="lvupN">Lv 2</span></div>
  <div id="flash"></div>
</div>

<div id="qOv">
  <div id="qCard">
    <div id="qTag"><span class="chip" id="qLesson"></span><span class="chip b" id="qNo"></span></div>
    <div id="qKo"></div>
    <div id="qText"></div>
    <div id="qOpts"></div>
    <div id="qFoot"></div>
  </div>
</div>

<div id="cut">
  <video id="cutV" playsinline></video>
  <div id="cutCard"><div class="m" id="cutM"></div><h1 id="cutH"></h1><p id="cutP"></p></div>
  <button id="cutSkip">건너뛰기 ›</button>
</div>

<div id="end">
  <div id="endCard">
    <h1>하얀 새가 되었어요 ✦</h1>
    <p id="endP"></p>
    <div class="btns"><button id="btnEndHome">처음으로</button><button class="g" id="btnEndAgain">엔딩 다시 보기</button></div>
  </div>
</div>

<!-- ================= 교사용 ================= -->
<div id="teacher" class="screen">
  <div class="tWrap">
    <div class="tHead">
      <h1>🌙 English Valley · 학생 진행 현황</h1>
      <div class="tBtns">
        <button class="tb g" id="tRefresh">새로고침</button>
        <button class="tb g" id="tCsv">CSV 내려받기</button>
        <button class="tb" id="tPreview">게임 체험하기 (기록 안 함)</button>
        <button class="tb g" id="tToStudent">학생 화면 바로가기</button>
        <button class="tb r" id="tReset">전체 초기화</button>
      </div>
    </div>
    <div class="sum" id="tSum"></div>
    <div class="tBox">
      <div class="legend">진행 칸:<i style="background:#4fcf9b"></i>첫 시도 정답<i style="background:#f6c256"></i>틀린 뒤 정답<i style="background:#f6a0a8"></i>풀이 중(오답)<i style="background:#e5dff3"></i>아직 안 함 · 5칸씩 맵 1~5</div>
      <table><thead><tr><th>상태</th><th>반</th><th>번호</th><th>이름</th><th>현재 맵</th><th>25문제 진행</th><th>해결</th><th>오답</th><th>최근 접속</th><th></th></tr></thead><tbody id="tBody"></tbody></table>
    </div>
    <div class="tBox"><div class="legend" style="font-size:14px;color:#5a4a96"><b>문항별 첫 시도 정답률</b> (푼 학생 기준)</div><div class="qStat" id="tQ"></div></div>
  </div>

function hash3(x,y,z){ let h=Math.imul(x+101,73856093)^Math.imul(y+101,19349663)^Math.imul(z+101,83492791); h=(h^(h>>>13))>>>0; return (h%1000)/1000; }
function mulberry(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function strHash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }

/* =====================================================================
   맵 만들기 도구  (x : 오른쪽-아래, y : 왼쪽-아래, z : 위)
   rect(…top…)   : 윗면 높이가 top 인 판 (아래로 thick 만큼)
   stairs(…)     : 한 칸마다 step(+1/-1) 씩 오르내리는 계단, g = 몇 번 문제를 풀면 나타나는지
   type  a=걷는 바닥 b=계단·다리 c=탑 d=장식(못 걸음) w=물 p=물바닥
   ===================================================================== */
class MB {
  constructor(){ this.cubes=[]; this.decos=[]; }
  add(x,y,z,t,g){ const c={x:x,y:y,z:z,t:t,g:g||0}; this.cubes.push(c); return c; }
  rect(x0,y0,x1,y1,top,t,g,thick,t2){ thick=thick||2; for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=top-thick;z<top;z++) this.add(x,y,z,(z===top-1)?t:(t2||t),g); }
  box(x0,y0,x1,y1,zb,zt,t,g){ for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=zb;z<zt;z++) this.add(x,y,z,t,g); }
  stairs(x0,y0,dx,dy,n,w,startTop,step,t,g,thick){ thick=thick||2;
    for(let i=0;i<n;i++){ const top=startTop+i*step; for(let j=0;j<w;j++){ const x=dy!==0?x0+j:x0+dx*i; const y=dy!==0?y0+dy*i:y0+j;
      for(let z=top-thick;z<top;z++) this.add(x,y,z,t,g); } } }
  /* 방(성의 한 구역): 바닥 + 두꺼운 벽 몸체 + 뒤쪽 난간(흉벽) + 창문 줄 */
  room(x0,y0,x1,y1,top,o){ o=o||{}; const g=o.g||0, th=o.th||3, body=o.body||'a', gaps=o.gaps||[]; const i0=this.cubes.length;
    this.rect(x0,y0,x1,y1,top,'a',g,th,body);
    for(let i=i0;i<this.cubes.length;i++){ const c=this.cubes[i]; c.w=(c.z<=top-2&&((top-c.z)%2===0))?1:0; }
    if(o.door){ const c=this.cubes.find((q,i)=>i>=i0&&q.x===o.door[0]&&q.y===o.door[1]&&q.z===top-th); if(c){ c.dt='door'; c.w=0; } }
    for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){ if((x===x0||y===y0)&&!gaps.some(q=>q[0]===x&&q[1]===y)) this.add(x,y,top,'r',g); } }
  /* 가는 탑 : 한 칸 기둥 + 뾰족 지붕 */
  tower(x,y,zb,zt,o){ o=o||{}; for(let z=zb;z<zt;z++){ const c=this.add(x,y,z,o.t||'d',o.g||0); c.w=((z-zb)%2===1)?2:0; }
    this.spire(x,y,zt,o.rh||2.4,o.rw||.98,o.rc); if(o.flag) this.flag(x,y,zt+(o.rh||2.4)-.2,1.7); }

function layout(o){

    links.push({A:A,B:B,dir:m.d,n:m.n,type:m.t,lat:lat}); rooms.push(B); A=B;

/* 나선 계단 (맵4 오르기 / 맵5 내려가기 공통) — 바깥쪽 난간 포함 */
function spiral(b,o){

    for(let i=i0;i<b.cubes.length;i++){ const q=b.cubes[i]; q.w=(q.z<=top-2&&((top-q.z)%2===0))?1:0; }
    if(o.turret&&y===o.a){ b.tower((x===o.a)?x+1:x,y,top,top+3,{rc:o.turret,rh:2,rw:.98}); } };

  b.stairs(c-1,a,-1,0,L,2,t+step,step,T,3,o.ts); rails(3,t,i=>[c-1-i,a,0]); t+=step*L; corner(a,a,t,A); cr.push([a,a,t]);

function colorsFor(def,c){
  let col=def.pal[c.t]||def.pal.a; if(c.t==='f'&&!def.pal.f) col=[mixHex(def.pal.a[0],'#ffffff',.3),mixHex(def.pal.a[1],'#ffffff',.25),mixHex(def.pal.a[2],'#ffffff',.2)]; if(c.t==='r'&&!def.pal.r) col=[mixHex(def.pal.a[0],'#ffffff',.25),mixHex(def.pal.a[1],'#ffffff',.2),mixHex(def.pal.a[2],'#ffffff',.12)];
  if(def.depth && def.deep && c.t!=='w'){
    const t=clamp(-c.z/34,0,1)*0.9; col=col.map((v,i)=>mixHex(v,def.deep[i],t));
  }
  return col;
}

function loadMap(idx,restore){ G.others={};

  for(const c of G.cubes){ c.col=colorsFor(def,c); c.key=c.x+c.y+c.z; c.unl=!c.g; c.vis=c.g?0:1; c.t0=0;
    if(c.w===undefined) c.w=((c.t==='c'||c.t==='d')&&hash3(c.x,c.y,c.z)<.32&&(c.z&1)===0)?1:0; }
  G.items=[]; for(const c of G.cubes) G.items.push({key:c.key,k:'c',r:c});

  G.npcs=def.qs.map((q,i)=>({qi:i,x:q[0],y:q[1],z:q[2],pal:NPC_PALS[i%NPC_PALS.length],seed:i*1.3}));
  G.chat=(def.chat||[]).map((q,i)=>({qi:null,x:q[0],y:q[1],z:q[2],pal:NPC_PALS[(i+2)%NPC_PALS.length],seed:i*2.1+.5,lines:def.chatLines||[],last:-99,cnt:i}));
  for(const n of G.npcs.concat(G.chat)) G.items.push({key:n.x+n.y+n.z+.3,k:'n',r:n});
  G.items.push({key:def.exit[0]+def.exit[1]+def.exit[2]+.3,k:'p',r:def.exit});
  G.items.sort((a,b2)=>a.key-b2.key||(a.k==='c'?-1:1));
  G.solved=new Set(); G.unlocked=new Set(); G.fx=[]; G.say=null; G.gearT={}; G.hideQ=new Set(); G.born={}; G.gemOn=new Set(); G.sparks=G.sparks||[]; G.portalOn=false; G.parts=[]; G.shake=0;
  rebuildNodes();
  const st=def.start; const p=G.player; p.x=st[0]+.5; p.y=st[1]+.5; p.z=st[2]; p.path=[]; p.seg=null; p.node=G.nodes.get(K(st[0],st[1],st[2])); p.face=1;
  if(restore){ restore.forEach(qi=>{ G.solved.add(qi); G.gemOn.add(qi); unlockGate(qi+1,true); });
    if(restore.length){ const last=Math.max.apply(null,restore); const q=def.qs[last]; p.x=q[0]+.5;p.y=q[1]+.5;p.z=q[2]; p.node=G.nodes.get(K(q[0],q[1],q[2])); }
    if(restore.length>=5) G.portalOn=true; }
  G.lvShown=calcLv(); makeBg(); fitCamera(true); updateHud();
}

function rebuildNodes(){
  const nodes=new Map();
  for(const c of G.cubes){ if(!c.unl||SIDE_W.indexOf(c.t)<0) continue;
    const up=G.cmap.get(K(c.x,c.y,c.z+1)); if(up&&up.unl) continue;
    nodes.set(K(c.x,c.y,c.z+1),{x:c.x,y:c.y,h:c.z+1,key:c.x+c.y+c.z+1}); }
  G.nodes=nodes;
}
function unlockGate(g,instant){
  if(G.unlocked.has(g)) return; G.unlocked.add(g); if(!instant) G.gearT[g]=G.t;
  const list=G.cubes.filter(c=>c.g===g); list.sort((a,b)=>(a.x+a.y+a.z*.5)-(b.x+b.y+b.z*.5)||0);
  // 걷는 방향을 따라 차례로 나타나도록 (계단 아래쪽부터)
  const first=list.length?list[0]:null;
  list.forEach((c,i)=>{ c.unl=true; if(instant){ c.vis=1; } else { c.t0=G.t+ (i*0.035); } });
  rebuildNodes();
}
function neighbors(n){
  const out=[]; const D=[[1,0],[-1,0],[0,1],[0,-1]];
  for(const d of D){ for(const dh of [0,1,-1]){ const m=G.nodes.get(K(n.x+d[0],n.y+d[1],n.h+dh)); if(m){ out.push(m); break; } } }
  return out;
}
function bfs(from,to){
  if(!from||!to) return null; if(from===to) return [from];
  const prev=new Map(); const q=[from]; prev.set(from,null);
  while(q.length){ const n=q.shift(); if(n===to) break; for(const m of neighbors(n)){ if(!prev.has(m)){ prev.set(m,n); q.push(m);} } }
  if(!prev.has(to)) return null;
  const path=[]; let c=to; while(c){ path.unshift(c); c=prev.get(c); } return path;
}

/* ---------- 카메라 ---------- */
function proj(x,y,z){ return [(x-y)*TW/2,(x+y)*TH/2-z*ZH]; }
function baseScale(){ return Math.min(G.W/1100,G.H/680); }
function fitCamera(snap){
  const def=G.def, cam=G.cam;
  if(def.cam==='fit'){
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    for(const c of G.cubes){ x0=Math.min(x0,(c.x-c.y-1)*TW/2); x1=Math.max(x1,(c.x-c.y+1)*TW/2);
      y0=Math.min(y0,(c.x+c.y)*TH/2-(c.z+1)*ZH); y1=Math.max(y1,(c.x+c.y+2)*TH/2-c.z*ZH); }
    for(const d of G.items){ if(d.k==='d'){ const o=d.r; y0=Math.min(y0,(o.x+o.y+1)*TH/2-(o.h+(o.hh||1.5)+1)*ZH); } }
    y0-=60; const bw=x1-x0, bh=y1-y0, topPad=60;
    let s=Math.min(G.W*0.94/bw,(G.H-topPad-10)/bh); s=clamp(s,.3,1.4);
    cam.s=s; cam.ox=G.W/2-(x0+bw/2)*s; cam.oy=topPad+(G.H-topPad)/2-(y0+bh/2)*s;
  } else {
    cam.s=baseScale()*(def.zoom||1);
    followTarget(snap?1:0,true);
  }
}
function followTarget(k,snap){
  const p=G.player, cam=G.cam; const P=proj(p.x,p.y,p.z);
  const tx=G.W/2-P[0]*cam.s, ty=G.H*0.56-P[1]*cam.s;
  if(snap||k>=1){ cam.ox=tx; cam.oy=ty; } else { cam.ox=lerp(cam.ox,tx,k); cam.oy=lerp(cam.oy,ty,k); }
}
const sp=(x,y,z)=>{ const P=proj(x,y,z); return [P[0]*G.cam.s+G.cam.ox,P[1]*G.cam.s+G.cam.oy]; };

function makeBg(){
  const W=G.W,H=G.H,def=G.def; const cv=document.createElement('canvas'); cv.width=Math.max(2,W*G.dpr|0); cv.height=Math.max(2,H*G.dpr|0);
  const c=cv.getContext('2d'); c.scale(G.dpr,G.dpr);
  const g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,def.bg[0]); g.addColorStop(.55,def.bg[1]); g.addColorStop(1,def.bg[2]);
  c.fillStyle=g; c.fillRect(0,0,W,H);
  const rnd=mulberry(77+G.mapIdx*13);
  const bi=def.bgi!=null?BG_IMGS[def.bgi]:null; const useImg=!!(bi&&bi.complete&&bi.naturalWidth);
  if(useImg){ const sc=Math.max(W/bi.naturalWidth,H/bi.naturalHeight); const dw=bi.naturalWidth*sc, dh=bi.naturalHeight*sc; c.drawImage(bi,(W-dw)/2,(H-dh)/2,dw,dh); }
  if(!useImg&&def.moon){ const mx=W*.74,my=H*.24,r=Math.min(W,H)*(def.fx==='snow'?.1:.14); let rg=c.createRadialGradient(mx,my,r*.6,mx,my,r*3.2); rg.addColorStop(0,'rgba(255,240,255,.5)'); rg.addColorStop(1,'rgba(255,240,255,0)');
    c.fillStyle=rg; c.fillRect(0,0,W,H); c.fillStyle='#fff7ee'; c.beginPath(); c.arc(mx,my,r,0,7); c.fill();
    c.fillStyle='rgba(210,190,230,.4)'; for(let i=0;i<6;i++){ c.beginPath(); c.arc(mx+(rnd()-.5)*r*1.1,my+(rnd()-.5)*r*1.1,r*(.08+rnd()*.12),0,7); c.fill(); } }
  if(!useImg&&def.sun){ const mx=W*.2,my=H*.3,r=Math.min(W,H)*.1; let rg=c.createRadialGradient(mx,my,r*.4,mx,my,r*4); rg.addColorStop(0,'rgba(255,255,230,.65)'); rg.addColorStop(1,'rgba(255,255,230,0)');
    c.fillStyle=rg; c.fillRect(0,0,W,H); c.fillStyle='rgba(255,252,235,.85)'; c.beginPath(); c.arc(mx,my,r,0,7); c.fill(); }
  if(!useImg&&(def.moon||def.depth)){ for(let i=0;i<90;i++){ c.fillStyle='rgba(255,255,255,'+(.25+rnd()*.6)+')'; const r=.6+rnd()*1.6; c.beginPath(); c.arc(rnd()*W,rnd()*H*(def.depth?1:.8),r,0,7); c.fill(); } }
  // 비네트
  const vg=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.4,W/2,H/2,Math.max(W,H)*.8); vg.addColorStop(0,'rgba(20,0,50,0)'); vg.addColorStop(1,'rgba(20,0,50,'+(useImg?.16:.38)+')');
  c.fillStyle=vg; c.fillRect(0,0,W,H);
  G.bgCache=cv;
  // 구름 sprite
  if(!G.cloud){ const cc=document.createElement('canvas'); cc.width=300; cc.height=120; const x=cc.getContext('2d');
    for(let i=0;i<9;i++){ const px=40+i*28,py=60+Math.sin(i*1.7)*14,r=30+((i*37)%22); const rg=x.createRadialGradient(px,py,2,px,py,r); rg.addColorStop(0,'rgba(255,255,255,.55)'); rg.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=rg; x.beginPath(); x.arc(px,py,r,0,7); x.fill(); }
    G.cloud=cc; }
  G.clouds=[]; const nc=def.depth?0:6; for(let i=0;i<nc;i++) G.clouds.push({x:rnd()*W,y:rnd()*H*.8,s:.7+rnd()*1.2,v:6+rnd()*14,a:.35+rnd()*.5});
  G.parts=[]; for(let i=0;i<46;i++) G.parts.push({x:rnd()*W,y:rnd()*H,r:1+rnd()*2.4,v:8+rnd()*22,ph:rnd()*6.28,up:def.depth?1:-1});
}

function poly(ctx,pts,fill){ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); ctx.strokeStyle=fill; ctx.lineWidth=1; ctx.lineJoin='round'; ctx.stroke(); }
function mixW(col,t){ return mixHex(col,'#ffffff',t); }
function hasOpaque(c,x,y,z){ const n=G.cmap.get(K(x,y,z)); if(!n||n.vis<.999||n.t==='r') return false; if(c.t==='w') return n.t==='w'; return n.t!=='w'; }
function archPath(ctx,u0,u1,v0,v1,asp){ const ru=(u1-u0)/2, rv=ru*asp, cu=(u0+u1)/2; ctx.beginPath(); ctx.moveTo(u0,v1); ctx.lineTo(u0,v0+rv); ctx.ellipse(cu,v0+rv,ru,rv,0,Math.PI,Math.PI*2); ctx.lineTo(u1,v1); ctx.closePath(); }
function faceDetail(ctx,c,right,ax,ay,hw,hh,h,kind){
  ctx.save(); if(right) ctx.transform(-hw,hh,0,h,ax+hw,ay+hh); else ctx.transform(hw,hh,0,h,ax-hw,ay+hh);
  if(kind==='door'){ archPath(ctx,.24,.76,.18,1.02,.62); ctx.fillStyle='#6b4a7a'; ctx.fill(); archPath(ctx,.31,.69,.26,1.02,.62); const lg=ctx.createLinearGradient(0,.2,0,1); lg.addColorStop(0,'#2d1c4a'); lg.addColorStop(1,'#5a3f78'); ctx.fillStyle=lg; ctx.fill();
    ctx.fillStyle='#ffd27a'; ctx.beginPath(); ctx.arc(.6,.66,.035,0,7); ctx.fill(); }
  else { const lit=G.def.lit&&hash3(c.x,c.y,c.z+(right?5:0))<.62; archPath(ctx,.34,.66,.2,.78,.78); ctx.fillStyle=lit?'#ffe3a0':'rgba(50,28,84,.46)'; ctx.fill();
    if(lit){ ctx.fillStyle='rgba(255,255,255,.55)'; ctx.fillRect(.4,.4,.06,.12); }
    ctx.fillStyle='rgba(255,255,255,.34)'; ctx.fillRect(.3,.78,.4,.055); }
  ctx.restore();
}
function drawCube(ctx,c,s,fade){
  const hw=TW/2*s, hh=TH/2*s, dz=ZH*s; const isR=c.t==='r';
  const f=isR?(c.lo?.34:(((c.x+c.y)&1)?.4:.8)):1;
  let ax=(c.x-c.y)*hw+G.cam.ox, ay=((c.x+c.y)*TH/2-(c.z+1)*ZH)*s+G.cam.oy+(1-f)*dz;
  if(ax<-hw*2||ax>G.W+hw*2||ay<-dz*2||ay>G.H+dz*2) return;
  const h=f*dz; let al=(fade==null?1:fade);
  if(c.vis<1){ const e=easeOut(c.vis); ay+=(1-e)*dz*2.5; al=Math.min(al,e); }
  if(al<1) ctx.globalAlpha=al;
  const col=c.col;
  const topOpen=!hasOpaque(c,c.x,c.y,c.z+1);
  if(topOpen){ poly(ctx,[[ax,ay],[ax+hw,ay+hh],[ax,ay+2*hh],[ax-hw,ay+hh]],col[0]);
    if(c.t!=='w'){ // 가장자리 하이라이트 (바깥으로 드러난 모서리만)
      const nl=G.cmap.get(K(c.x,c.y+1,c.z)), nr=G.cmap.get(K(c.x+1,c.y,c.z)); const lt=mixW(col[0],.55);
      ctx.lineCap='round'; ctx.lineWidth=Math.max(1,1.7*s); ctx.strokeStyle=lt; ctx.beginPath();
      if(!nl||nl.vis<.5){ ctx.moveTo(ax-hw,ay+hh); ctx.lineTo(ax,ay+2*hh); }
      if(!nr||nr.vis<.5){ ctx.moveTo(ax+hw,ay+hh); ctx.lineTo(ax,ay+2*hh); }
      ctx.stroke(); } }
  const band=(!isR&&c.t!=='w'&&topOpen)?dz*.2:0;
  if(!hasOpaque(c,c.x,c.y+1,c.z)){ poly(ctx,[[ax-hw,ay+hh],[ax,ay+2*hh],[ax,ay+2*hh+h],[ax-hw,ay+hh+h]],col[1]);
    if(band){ poly(ctx,[[ax-hw,ay+hh],[ax,ay+2*hh],[ax,ay+2*hh+band],[ax-hw,ay+hh+band]],mixW(col[1],.24)); }
    if(c.dt==='door') faceDetail(ctx,c,false,ax,ay,hw,hh,h,'door');

  for(const n of G.nodes.values()){ const P=sp(n.x+.5,n.y+.5,n.h); const dx=Math.abs(sx-P[0])/(TW/2*s), dy=Math.abs(sy-P[1])/(TH/2*s);
    if(dx+dy<=1.08){ if(!best||n.key>best.key) best=n; } }
  return best;
}
function onTap(e){
  Snd.init(); if(G.state!=='play') return; const pos=canvasPos(e); const target=pickNode(pos[0],pos[1]); if(!target) return;
  const p=G.player; const from=p.seg?p.seg.node:p.node; const path=bfs(from,target);
  if(!path){ G.shake=.25; toast('아직 갈 수 없어요'); return; }
  if(p.seg){ p.path=path.slice(1); } else { p.path=path.slice(1); if(!p.path.length) onArrive(p.node); }
}

function hueOf(n){ let h=0; for(const ch of String(n)) h=(h*31+ch.charCodeAt(0))%360; return h; }
function girlPal(n){ const h=hueOf(n); return {c0:'hsl('+h+',80%,94%)',c1:'hsl('+h+',70%,86%)',c2:'hsl('+h+',55%,72%)',t:'hsl('+((h+160)%360)+',75%,78%)'}; }

function updateOthers(dt){ for(const k in G.others){ const e=G.others[k]; const dx=e.tx-e.x, dy=e.ty-e.y, dz=e.tz-e.z; const d=Math.abs(dx)+Math.abs(dy)+Math.abs(dz);

function isoBox(c,x,y,w,h,top,l,r){ const hw=w/2,hh=w/4; c.fillStyle=l; c.beginPath(); c.moveTo(x-hw,y); c.lineTo(x,y+hh); c.lineTo(x,y+hh+h); c.lineTo(x-hw,y+h); c.closePath(); c.fill();
  c.fillStyle=r; c.beginPath(); c.moveTo(x+hw,y); c.lineTo(x,y+hh); c.lineTo(x,y+hh+h); c.lineTo(x+hw,y+h); c.closePath(); c.fill();
  c.fillStyle=top; c.beginPath(); c.moveTo(x,y-hh); c.lineTo(x+hw,y); c.lineTo(x,y+hh); c.lineTo(x-hw,y); c.closePath(); c.fill(); }
function sceneSky(c,W,H,t,cols){ const g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,cols[0]); g.addColorStop(.6,cols[1]); g.addColorStop(1,cols[2]); c.fillStyle=g; c.fillRect(0,0,W,H);
  const rr=mulberry(11); for(let i=0;i<110;i++){ const x=rr()*W,y=rr()*H*.75,r=.5+rr()*1.7; c.globalAlpha=.3+.6*Math.abs(Math.sin(t*1.4+i)); c.fillStyle='#fff'; c.beginPath(); c.arc(x,y,r,0,7); c.fill(); } c.globalAlpha=1; }
function moon(c,x,y,r){ const rg=c.createRadialGradient(x,y,r*.5,x,y,r*3); rg.addColorStop(0,'rgba(255,240,255,.5)'); rg.addColorStop(1,'rgba(255,240,255,0)'); c.fillStyle=rg; c.fillRect(x-r*3,y-r*3,r*6,r*6); c.fillStyle='#fff7ee'; c.beginPath(); c.arc(x,y,r,0,7); c.fill(); }
function sceneText(c,W,lines){ c.textAlign='center'; for(const L of lines){ const a=clamp((L.t-L.at)/.9,0,1)*(L.end?clamp((L.end-L.t)/.7,0,1):1); if(a<=0) continue; c.globalAlpha=a; c.fillStyle=L.col||'#fff'; c.font=L.font; c.shadowColor='rgba(255,255,255,.6)'; c.shadowBlur=L.glow||0; c.fillText(L.text,W/2,L.y+(1-a)*14); c.shadowBlur=0; } c.globalAlpha=1; }

/* =====================================================================

   ===================================================================== */
function startGame(rec,preview,mapIdx){
  G.rec=rec; G.preview=!!preview; G.pvCount=0; G.qOrder={}; G.qWrong={}; G.final=null; G.sparks=[];
  showScreen('game'); resize();
  let idx=preview?(mapIdx||0):clamp(rec.map||0,0,NMAP-1);
  const solved=[]; for(let i=0;i<5;i++){ const r=rec.q&&rec.q[idx*5+i]; if(r&&r.c) solved.push(i); }
  const hasProgress=Object.keys(rec.q||{}).length>0;
  const go=()=>{ loadMap(idx,preview?null:solved); G.state='play'; $('flash').style.opacity='0'; showHint(); if(preview) renderPrev(); };
  const goT=()=>{ G.state='cut'; playTransition(idx,()=>{ loadMap(idx,solved); $('flash').style.opacity='0'; },()=>{ G.state='play'; showHint(); }); };
  $('prev').classList.toggle('on',!!preview); if(preview) renderPrev();
  if(!preview&&!hasProgress&&idx===0){ if(MEDIA.intro) playCut(MEDIA.intro,'잉글리시 밸리','English Valley',MAPS[0].story,()=>{ goT(); }); else playScene('intro',goT); }
  else if(preview){ go(); }
  else { goT(); }
  if(!G.loop){ G.loop=true; last=performance.now(); requestAnimationFrame(frame); }
}
function renderPrev(){ const el=$('prev'); el.innerHTML='<span class="pill" style="padding:6px 12px;font-size:13px">체험</span>'; for(let i=0;i<NMAP;i++){ const b=document.createElement('button'); b.textContent='맵 '+(i+1); b.onclick=()=>{ G.final=null; $('end').classList.remove('on'); $('flash').style.opacity='0'; loadMap(i,null); G.state='play'; }; el.appendChild(b); }
  const b=document.createElement('button'); b.textContent='모두 풀기'; b.onclick=()=>{ if(G.state!=='play') return; for(let i=0;i<5;i++){ G.solved.add(i); unlockGate(i+1,true); } G.portalOn=true; updateHud(); }; el.appendChild(b); }

function showEnd(){
  let ok=0,tries=0; if(G.rec){ for(const k in G.rec.q){ const r=G.rec.q[k]; if(r.c) ok++; tries+=r.a; } }
  const wrong=tries-ok;
  $('endP').innerHTML=(G.preview?'체험 모드를 마쳤어요.':(G.user?G.user.name+' 친구,<br>':'')+(NMAP*5)+'문제를 모두 해결했어요!<br>다시 도전한 횟수: '+wrong+'번')+'<br>하얀 새는 꿈 밖으로 날아갔답니다 ✦';
  if(!G.preview&&G.rec){ G.rec.done=true; G.rec.map=NMAP-1; saveRec(); }
  const finish=()=>{ $('end').classList.add('on'); };
  if(MEDIA.ending) playCut(MEDIA.ending,'','','',finish); else playScene('outro',finish);
}
function goHome(){ $('hud').style.display=''; $('prev').style.display=''; G.state='login'; G.final=null; $('end').classList.remove('on'); $('qOv').classList.remove('on'); $('flash').style.opacity='0'; showScreen('login'); $('cut').classList.remove('on'); }
function showScreen(n){ ['login','game','teacher'].forEach(s=>$(s).classList.toggle('on',s===n)); }

/* ---------- 메인 루프 ---------- */
let last=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; G.t+=dt;
  if($('game').classList.contains('on')&&G.def){
    if(G.state==='play'||G.state==='marking'||G.state==='question') updatePlayer(dt);
    if(G.final) updateFinal(dt);
    if(G.def.cam==='follow'&&!(G.final&&G.final.phase===2)) followTarget(Math.min(1,dt*3.5));
    render(dt);
  }
  requestAnimationFrame(frame);
}
function resize(){
  const cv=G.cv; G.dpr=Math.min(window.devicePixelRatio||1,1.75); G.W=window.innerWidth; G.H=window.innerHeight;
  cv.width=G.W*G.dpr; cv.height=G.H*G.dpr; cv.style.width=G.W+'px'; cv.style.height=G.H+'px';
  if(G.def){ makeBg(); fitCamera(true); }
}

/* =====================================================================
   교사용 화면
   ===================================================================== */
let teacherPw='', teacherTimer=null;
function askPw(then){ $('pwIn').value=''; $('pwErr').textContent=''; $('pwOv').classList.add('on'); setTimeout(()=>$('pwIn').focus(),50);
  const go=()=>{ const v=$('pwIn').value.trim(); api.call('teacherLogin',v).then(ok=>{ if(ok){ teacherPw=v; $('pwOv').classList.remove('on'); then(); } else { $('pwErr').textContent='비밀번호가 달라요'; } }).catch(()=>{ $('pwErr').textContent='연결 오류'; }); };
  $('pwOk').onclick=go; $('pwIn').onkeydown=e=>{ if(e.key==='Enter') go(); }; $('pwCancel').onclick=()=>$('pwOv').classList.remove('on'); }
function openTeacher(){ showScreen('teacher'); G.state='login'; refreshTeacher(); clearInterval(teacherTimer); teacherTimer=setInterval(()=>{ if($('teacher').classList.contains('on')) refreshTeacher(); },5000); }
let tData=null;
function refreshTeacher(){ api.call('getAll',teacherPw).then(d=>{ tData=d; renderTeacher(d); }).catch(()=>{}); }
function ago(ms){ const s=Math.max(0,Math.round(ms/1000)); if(s<60) return s+'초 전'; if(s<3600) return Math.round(s/60)+'분 전'; if(s<86400) return Math.round(s/3600)+'시간 전'; return Math.round(s/86400)+'일 전'; }
function renderTeacher(d){
  const now=d.now, list=d.list.slice().sort((a,b)=>(+a.ban)-(+b.ban)||(+a.num)-(+b.num));
  let online=0,fin=0,sumSolved=0; const qs=[]; for(let i=0;i<NMAP*5;i++) qs.push({att:0,first:0,solved:0});
  const rows=list.map(r=>{
    let solved=0,wrong=0; let cells=''; for(let m=0;m<NMAP;m++){ cells+='<span class="cells'+(m<NMAP-1?' g':'')+'">'; for(let i=0;i<5;i++){ const id=m*5+i, q=r.q[id]; let c='';
        if(q){ qs[id].att++; if(q.c){ solved++; qs[id].solved++; if(q.a===1){ c='f'; qs[id].first++; } else c='s'; wrong+=q.a-1; } else { c='t'; wrong+=q.a; } }
        cells+='<i class="'+c+'" title="'+QUESTIONS[id].q.replace(/"/g,'').split('\n')[0]+' · 시도 '+(q?q.a:0)+'회"></i>'; } cells+='</span>'; }
    const on=(now-r.last)<45000; if(on) online++; if(r.done) fin++; sumSolved+=solved;
    return '<tr><td><span class="on-dot'+(on?' y':'')+'"></span>'+(r.done?'<span class="badge fin">완료</span>':on?'<span class="badge on">접속중</span>':'<span class="badge">쉬는 중</span>')+'</td><td>'+r.ban+'</td><td>'+r.num+'</td><td class="nm">'+esc(r.name)+'</td><td><span class="badge">MAP '+((r.map||0)+1)+'</span></td><td>'+cells+'</td><td>'+solved+'/25</td><td>'+wrong+'</td><td>'+ago(now-r.last)+'</td><td><button class="tb g" style="padding:4px 10px;font-size:12px" data-del="'+esc(r.key)+'">삭제</button></td></tr>';
  }).join('');
  $('tBody').innerHTML=rows||'<tr><td colspan="10" style="padding:30px;color:#9a8cc4">아직 접속한 학생이 없어요</td></tr>';
  $('tBody').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ if(confirm('이 학생 기록을 삭제할까요?')) api.call('deleteStudent',teacherPw,b.getAttribute('data-del')).then(refreshTeacher); });
  const avg=list.length?Math.round(sumSolved/list.length*10)/10:0;
  $('tSum').innerHTML='<div class="sumC"><small>접속한 학생</small><div>'+list.length+'명</div></div><div class="sumC"><small>지금 접속 중</small><div>'+online+'명</div></div><div class="sumC"><small>끝까지 완료</small><div>'+fin+'명</div></div><div class="sumC"><small>평균 해결 문항</small><div>'+avg+' / 25</div></div>';
  $('tQ').innerHTML=qs.map((q,i)=>{ const pct=q.att?Math.round(q.first/q.att*100):0; return '<div class="qs"><b>Q'+(i+1)+'</b> · Lesson '+QUESTIONS[i].u+' · '+(q.att?pct+'%':'-')+' <span style="color:#9a8cc4">('+q.first+'/'+q.att+')</span><div style="margin-top:3px;color:#6a5a9a">'+esc(QUESTIONS[i].q.split('\n')[0].slice(0,34))+'</div><div class="bar"><i style="width:'+pct+'%"></i></div></div>'; }).join('');
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function csv(){
  if(!tData) return; const now=tData.now; const rows=[['반','번호','이름','현재맵','해결문항','오답횟수','완료','최근접속'].concat(QUESTIONS.map((_,i)=>'Q'+(i+1)+'(시도/정답)'))];
  tData.list.slice().sort((a,b)=>(+a.ban)-(+b.ban)||(+a.num)-(+b.num)).forEach(r=>{ let s=0,w=0; const qc=[]; for(let i=0;i<NMAP*5;i++){ const q=r.q[i]; if(q){ if(q.c){ s++; w+=q.a-1; } else w+=q.a; qc.push(q.a+'/'+(q.c?'O':'X')); } else qc.push(''); }
    rows.push([r.ban,r.num,r.name,(r.map||0)+1,s,w,r.done?'O':'',new Date(r.last).toLocaleString('ko-KR')].concat(qc)); });
  const txt='﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'})); a.download='EnglishValley_진행현황.csv'; document.body.appendChild(a); a.click(); a.remove();
}

/* =====================================================================
   이벤트 연결
   ===================================================================== */
window.addEventListener('DOMContentLoaded',()=>{
  G.cv=$('cv'); G.ctx=G.cv.getContext('2d'); resize(); window.addEventListener('resize',resize);
  G.cv.addEventListener('pointerdown',onTap);
  const KD={ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0],ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1]};
  window.addEventListener('keydown',e=>{
    const tg=e.target&&e.target.tagName; if(tg==='INPUT'||tg==='TEXTAREA') return;
    if($('qOv').classList.contains('on')){ const k=e.key.toLowerCase(); let n=-1; if(k>='1'&&k<='4') n=+k-1; else if('abcd'.includes(k)&&k.length===1) n='abcd'.indexOf(k); const bs=$('qOv').querySelectorAll('.opt'); if(n>=0&&bs[n]&&!bs[n].classList.contains('dead')){ bs[n].click(); e.preventDefault(); } return; }
    if($('cut').classList.contains('on')&&(e.key===' '||e.key==='Enter'||e.key==='Escape')){ $('cutSkip').click(); e.preventDefault(); return; }
    if($('scn').classList.contains('on')&&(e.key===' '||e.key==='Enter'||e.key==='Escape')){ $('scnSkip').click(); e.preventDefault(); return; }
    const d=KD[e.key]; if(!d||G.state!=='play'||!$('game').classList.contains('on')) return; e.preventDefault(); Snd.init();
    const p=G.player; if(p.path.length>=1) return; const from=p.seg?p.seg.node:p.node; if(!from) return;
    for(const dh of [0,1,-1]){ const m=G.nodes.get(K(from.x+d[0],from.y+d[1],from.h+dh)); if(m){ p.path=[m]; return; } }
    G.shake=.12;
  });
  $('btnStart').onclick=()=>{ Snd.init();
    const ban=$('inBan').value.trim(), num=$('inNum').value.trim(), name=$('inName').value.trim();
    if(!ban||!num||!name){ $('loginErr').textContent='반, 번호, 이름을 모두 써 주세요'; return; }
    $('loginErr').textContent='들어가는 중…'; $('btnStart').disabled=true;
    api.call('login',ban,num,name).then(rec=>{ $('btnStart').disabled=false; $('loginErr').textContent=''; G.user={ban:ban,num:num,name:name}; startGame(rec,false); })
      .catch(()=>{ $('btnStart').disabled=false; $('loginErr').textContent='연결이 잘 안 돼요. 잠시 뒤 다시 눌러 주세요'; }); };
  ['inBan','inNum','inName'].forEach(id=>$(id).addEventListener('keydown',e=>{ if(e.key==='Enter') $('btnStart').click(); }));
  $('btnToTeacher').onclick=()=>askPw(openTeacher);
  $('btnTeacherG').onclick=()=>askPw(()=>{ G.state='login'; openTeacher(); });
  $('btnHome').onclick=goHome;
  $('btnSnd').onclick=()=>{ Snd.on=!Snd.on; $('btnSnd').textContent=Snd.on?'🔊':'🔇'; };
  $('tRefresh').onclick=refreshTeacher; $('tCsv').onclick=csv;
  $('tToStudent').onclick=()=>{ clearInterval(teacherTimer); goHome(); };
  $('tPreview').onclick=()=>{ clearInterval(teacherTimer); startGame({key:'preview',q:{},map:0},true,0); };
  $('tReset').onclick=()=>{ if(confirm('모든 학생 기록을 지울까요? 되돌릴 수 없어요.')&&confirm('정말 전체 초기화할까요?')) api.call('resetAll',teacherPw).then(refreshTeacher); };
  $('btnEndHome').onclick=goHome;
  $('btnEndAgain').onclick=()=>{ $('end').classList.remove('on'); if(G.preview){ loadMap(NMAP-1,null); G.state='play'; } else { startGame(G.rec,false); } };
  // 디버그/자동 테스트용
  window.__dt={G:G,loadMap:loadMap,startGame:startGame,validate:validateMaps,openQuestion:openQuestion,startFinal:startFinal,enterPortal:enterPortal,sp:sp};
});

/* ---------- 맵 검증 (개발용) ---------- */
function validateMaps(){
  const out=[]; const saveState={mapIdx:G.mapIdx};
  MAPS.forEach((def,mi)=>{ loadMap(mi,null); const rep={map:mi+1,ok:true,msgs:[]};
    const st0=G.nodes.get(K(def.start[0],def.start[1],def.start[2])); if(!st0){ rep.ok=false; rep.msgs.push('시작 지점이 걷는 칸이 아님'); }
    const qn0=def.qs.map((q,i)=>G.nodes.get(K(q[0],q[1],q[2])));
    // 문제칸은 처음엔 Q1 만 도달 가능해야 함. 게이트가 하나 열릴 때마다 한 칸씩 늘어남
    for(let g=0;g<=5;g++){
      if(g>0) unlockGate(g,true);
      const st=G.nodes.get(K(def.start[0],def.start[1],def.start[2])); const qn=def.qs.map(q=>G.nodes.get(K(q[0],q[1],q[2])));
      const reach=new Set(); const q=[st]; reach.add(st); while(q.length){ const n=q.shift(); for(const m of neighbors(n)){ if(!reach.has(m)){ reach.add(m); q.push(m);} } }
      const reachQ=qn.map(n=>n&&reach.has(n)?1:0).join('');
      const ex=G.nodes.get(K(def.exit[0],def.exit[1],def.exit[2])); const exR=ex&&reach.has(ex)?1:0;
      rep.msgs.push('gate'+g+': Q='+reachQ+' exit='+exR);
      const want=qn.map((n,i)=>i<=g?1:0).join(''); if(g<5&&reachQ!==want){ rep.ok=false; rep.msgs.push('  ✗ 기대 '+want); }
      if(g===5&&(!exR||reachQ!=='11111')){ rep.ok=false; rep.msgs.push('  ✗ 마지막에 모두 도달해야 함'); }
      if(g<5&&exR){ rep.ok=false; rep.msgs.push('  ✗ 문이 너무 일찍 도달 가능'); }
    }
    qn0.forEach((n,i)=>{ if(!n){ rep.ok=false; rep.msgs.push('Q'+(i+1)+' 칸이 걷는 칸이 아님'); } });
    out.push(rep); });
  return out;
}
