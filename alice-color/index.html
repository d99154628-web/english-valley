<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>앨리스와 색깔 정원 · What Color Is It?</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{--mag:#c2187a;--mag2:#e33fa1;--gold:#ffd25a;--gold2:#c98a12;--cream:#fff8ec;--ink:#3b1636}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#1a0b1f;overflow:hidden;font-family:'Jua',sans-serif;color:var(--ink)}
button{font-family:inherit;cursor:pointer}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;overflow:hidden;background:#2a0f2e;box-shadow:0 0 80px #000}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .9s;transform:scale(1.04)}
.bg.on{opacity:1;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.11) translate(-1.2%,-1%)}}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,#2a0a2a99 100%);pointer-events:none}
/* 위쪽 */
#top{position:absolute;left:24px;right:24px;top:20px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;z-index:5}
.chip,.tbtn,#roses span{white-space:nowrap}
.chip{background:linear-gradient(180deg,#fff7e6,#ffe7b8);border:4px solid var(--gold);border-radius:30px;padding:8px 22px;font-size:26px;color:#8a2a62;box-shadow:0 6px 0 var(--gold2),0 10px 24px #0006}
#roses{display:flex;gap:6px;background:linear-gradient(180deg,#fff7e6,#ffe7b8);border:4px solid var(--gold);border-radius:30px;padding:6px 14px;box-shadow:0 6px 0 var(--gold2),0 10px 24px #0006;align-items:center}
#roses span{font-size:20px;color:#8a2a62;margin-right:6px}
.rose{width:44px;height:44px;transition:transform .5s}
.rose.got{animation:pop .7s}
@keyframes pop{40%{transform:scale(1.6) rotate(-12deg)}100%{transform:scale(1)}}
#tools{display:flex;gap:10px}
.tbtn{background:#fff9;border:3px solid #fff;border-radius:16px;padding:6px 12px;font-size:19px;color:#7a1f57;box-shadow:0 4px 12px #0005}
/* 이야기 띠 */
#banner{position:absolute;left:40px;right:40px;bottom:26px;min-height:150px;z-index:6;background:linear-gradient(180deg,#e23e9f,#a3126a);border:6px solid var(--gold);border-radius:26px;box-shadow:0 8px 0 var(--gold2),0 18px 40px #000a,inset 0 2px 0 #ffffff66;padding:20px 190px 20px 40px;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:8px;transition:transform .4s,opacity .4s}
#banner.mini{min-height:96px;padding-top:38px;padding-bottom:14px}#banner.mini #say{font-size:26px}#banner.mini #en{font-size:30px}
#banner.hide{transform:translateY(130%);opacity:0}
#who{position:absolute;top:-26px;left:36px;background:linear-gradient(180deg,#fff8e6,#ffdf8e);color:#a3126a;border:4px solid var(--gold);border-radius:20px;padding:4px 20px;font-size:26px}
#banner{padding-top:34px}#replay{position:absolute;top:-24px;left:230px;background:linear-gradient(180deg,#fff8e6,#ffdf8e);color:#a3126a;border:4px solid var(--gold);border-radius:20px;padding:3px 16px;font-size:22px}
#say.reading{text-shadow:0 0 12px #fff6,0 2px 0 #7a0e4d}
#say{font-size:34px;line-height:1.45;text-shadow:0 2px 0 #7a0e4d}
#en{font-family:'Fredoka',sans-serif;font-size:38px;font-weight:700;color:#fff5b8;text-shadow:0 3px 0 #7a0e4d;display:flex;align-items:center;gap:14px}
#en:empty{display:none}
.speak{background:#fff;border:3px solid var(--gold);border-radius:50%;width:54px;height:54px;font-size:26px;flex:none;box-shadow:0 4px 0 var(--gold2)}
#nav{position:absolute;right:22px;bottom:30px;display:flex;gap:10px}
.nbtn{width:70px;height:70px;border-radius:50%;border:5px solid var(--gold);background:radial-gradient(circle at 35% 30%,#fff,#ffe1a1);font-size:34px;color:#a3126a;box-shadow:0 5px 0 var(--gold2)}
.nbtn:disabled{opacity:.4}
/* 활동 판 */
#panel{position:absolute;left:50%;top:48%;max-height:680px;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;z-index:4;transition:.45s cubic-bezier(.2,1.4,.4,1);background:linear-gradient(180deg,#fffdf6ee,#fff1d6ee);border:7px solid var(--gold);border-radius:34px;box-shadow:0 10px 0 var(--gold2),0 30px 80px #000b;padding:28px 40px;max-width:1360px;min-width:700px;text-align:center}
#panel.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#panel .corner{position:absolute;top:-48px;left:-50px;font-size:100px;line-height:1;filter:drop-shadow(0 8px 10px #0006);animation:bob 2.4s ease-in-out infinite;pointer-events:none}
@keyframes bob{0%,100%{transform:rotate(-10deg) translateY(0)}50%{transform:rotate(6deg) translateY(-10px)}}
.emo{font-size:58px;line-height:1.1;display:block}
#who .we{font-size:40px;vertical-align:middle;margin-right:6px;display:inline-block;transform:translateY(-4px)}
#panel h2{margin:0 0 6px;font-size:40px;color:#a3126a}
#panel .sub{font-size:24px;color:#7b4c6a;margin-bottom:18px}
.book{display:inline-block;background:#7a1f57;color:#fff;border-radius:14px;padding:4px 14px;font-size:20px;margin-left:8px;vertical-align:middle}
.big{font-family:'Fredoka',sans-serif;font-weight:700}
.pbtn{background:linear-gradient(180deg,#ff6cc0,#c2187a);color:#fff;border:4px solid var(--gold);border-radius:20px;padding:10px 26px;font-size:28px;box-shadow:0 5px 0 var(--gold2);margin:6px}
.pbtn.soft{background:linear-gradient(180deg,#fff,#ffe9c2);color:#a3126a}
/* ABC */
.abc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:1180px;margin:0 auto}
.tile{width:74px;height:84px;border-radius:14px;background:linear-gradient(180deg,#fff,#f1e3ff);border:3px solid #c9a7e8;font:700 44px 'Fredoka';color:#6a2c91;display:grid;place-items:center;box-shadow:0 4px 0 #b28ad6}
.tile.q{background:linear-gradient(180deg,#ffe58a,#ffbf2e);border-color:#fff;color:#a3126a;cursor:pointer;animation:glow 1.4s infinite alternate}
.tile.open{animation:flip .6s;background:linear-gradient(180deg,#ff8fd0,#d42a8c);color:#fff;border-color:#fff}
@keyframes glow{to{box-shadow:0 4px 0 #c98a12,0 0 26px #ffd25a}}
@keyframes flip{50%{transform:rotateY(90deg)}}
/* 찬트 */
.chant{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:6px auto 10px;max-width:980px}
.cl{background:#fff;border:4px solid #f3c7e2;border-radius:20px;padding:14px 20px;font:700 44px 'Fredoka';color:#6b2d5c;transition:.25s}
.cl b{color:#d42a8c}.cl.r b{color:#e0402a}.cl.l b{color:#2a7de0}
.cl.hl{transform:scale(1.07);background:#fff3b0;border-color:var(--gold)}
.fs{display:flex;gap:18px;justify-content:center;margin-top:8px}
.fsc{width:210px;background:#fff;border:4px solid #f3c7e2;border-radius:22px;padding:12px;cursor:pointer}
.fsc .w{font:700 46px 'Fredoka';color:#6b2d5c}.fsc .w span{display:inline-block;min-width:38px;border-bottom:4px solid #d42a8c;color:#d42a8c}
.fsc .n{font-size:22px;color:#9b6a8b}
/* Read Me */
.readme{white-space:nowrap;font:700 70px 'Fredoka';color:#d42a8c;letter-spacing:2px;margin:10px 0;text-shadow:0 5px 0 #ffd25a}
.hearts{font-size:56px;letter-spacing:8px}
/* 픽셀 */
.pixwrap{display:flex;gap:30px;align-items:center;justify-content:center}
.pix{display:grid;grid-template-columns:repeat(12,28px);gap:3px;background:#e7d9ec;padding:8px;border-radius:14px}
.px{width:28px;height:28px;font-size:15px;border-radius:6px;background:#fff;font:700 18px 'Fredoka';color:#b59ab0;display:grid;place-items:center;transition:background .3s,color .3s}
.px.z{background:#fff;color:transparent}
.legend{display:flex;flex-direction:column;gap:12px;text-align:left}
.lg{white-space:nowrap;display:flex;align-items:center;gap:12px;background:#fff;border:4px solid #f3c7e2;border-radius:18px;padding:10px 16px;font:700 34px 'Fredoka';color:#6b2d5c;cursor:pointer}
.lg i{width:42px;height:42px;border-radius:10px;border:3px solid #fff;box-shadow:0 0 0 2px #ccc;font-style:normal;display:grid;place-items:center;color:#fff;font-size:24px}
.lg.done{background:#fff7d0;border-color:var(--gold)}
/* 섞기 */
.mixrow{display:flex;align-items:center;justify-content:center;gap:20px;margin:12px 0;font:700 40px 'Fredoka';color:#6b2d5c}
.blob{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:inset -8px -10px 0 #0002,0 6px 14px #0003;transition:transform .6s}
.res{width:190px;height:96px;border-radius:48px;border:4px dashed #d9a3c6;display:grid;place-items:center;font:700 38px 'Fredoka';color:#c9a7bd;background:#fff;transition:.5s}
.res.on{border-style:solid;color:#fff}
.word{min-width:200px;text-align:left}
/* 몬드리안 */
.mond{display:grid;grid-template-columns:2fr 1fr 1.2fr;grid-template-rows:1.4fr 1fr 1fr;gap:12px;background:#151515;padding:12px;width:520px;height:440px;border-radius:6px;margin:0 auto}
.mb{cursor:pointer;transition:transform .2s;position:relative}
.mb:hover{transform:scale(.97)}
.mondwrap{display:flex;gap:30px;align-items:center;justify-content:center}
.bubbles{width:520px;text-align:left;display:flex;flex-direction:column;gap:14px}
.bub{background:#fff;border:4px solid #f3c7e2;border-radius:24px;padding:14px 22px;font:700 40px 'Fredoka';color:#6b2d5c;opacity:.35;transform:translateY(10px);transition:.4s}
.bub.on{opacity:1;transform:none}
.bub.q{border-color:#ff8fc8;background:#fff0f8}
.bub small{display:block;font:20px 'Jua';color:#a07a95}
.aha{margin-top:12px;background:#fff3b0;border:4px solid var(--gold);border-radius:20px;padding:10px 18px;font:700 34px 'Fredoka';color:#7a1f57}
/* 미션 */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:8px 0 14px}
.st{background:#fff;border:4px solid #f3c7e2;border-radius:22px;padding:10px 14px;font-size:23px;color:#6b2d5c}
.st b{display:block;font-size:34px;color:#d42a8c}
.talk{background:#fff0f8;border:4px dashed #ff8fc8;border-radius:22px;padding:10px;font:700 32px 'Fredoka';color:#6b2d5c;line-height:1.5}
.timer{font:700 54px 'Fredoka';color:#a3126a;margin-right:10px}
.trow{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:10px}.trow .pbtn{font-size:22px;padding:8px 16px}
/* 마무리 */
.diary{display:flex;gap:16px;justify-content:center;margin:12px 0}
.dw{background:#fff;border:4px solid #f3c7e2;border-radius:18px;padding:10px 22px;font:700 44px 'Fredoka';color:#6b2d5c}
/* 표지 */
#cover{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at center,#2a0a2a33,#2a0a2acc)}
#endScreen{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at center,#2a0a2a22,#2a0a2acc)}
#endScreen h1,#cover h1{margin:0;font-size:120px;color:#fff;text-shadow:0 6px 0 #a3126a,0 10px 0 var(--gold2),0 0 40px #ff6cc0;letter-spacing:4px}
#endScreen .eng,#cover .eng{font:700 56px 'Fredoka';color:var(--gold);text-shadow:0 4px 0 #7a0e4d}
#endScreen .info,#cover .info{font-size:28px;color:#fff;background:#a3126acc;border:4px solid var(--gold);border-radius:30px;padding:8px 28px}
.startbtn{margin-top:20px;font-size:44px;padding:16px 60px;border-radius:40px}
/* 반짝이 */
.spark{position:absolute;pointer-events:none;width:10px;height:10px;border-radius:50%;background:radial-gradient(#fff,#ffd25a 50%,transparent 70%);animation:fly 1.2s ease-out forwards;z-index:9}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
/* 비밀번호 */
#pass{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:50}
#pass.on{display:grid}
#pass form{background:#fff8ec;border:6px solid var(--gold);border-radius:24px;padding:30px 40px;text-align:center;font-size:24px}
#pass input{font-size:30px;padding:8px;width:220px;text-align:center;border:3px solid #e3b8d3;border-radius:12px;margin:12px 0;display:block}
.mode-student .tonly{display:none!important}
.mode-teacher .sonly{display:none!important}
</style></head>
<body class="mode-student">
<div id="stage">
  <div id="bgs"></div><div class="vignette"></div>
  <div id="top">
    <div style="display:flex;gap:12px;align-items:center"><div class="chip" id="sceneChip">표지</div><div class="chip" id="actChip" style="display:none"></div></div>
    <div id="roses"><span>여왕의 장미</span></div>
    <div id="tools">
      <button class="tbtn" id="wsBtn" onclick="window.open('worksheet.html','_blank')">🖨️ 학습지 인쇄</button>
      <button class="tbtn" id="autoBtn">🔊 자동 읽기 켬</button>
      <button class="tbtn tonly" id="toggleBanner" title="이야기 띠 숨기기/보이기">💬 이야기</button>
      <button class="tbtn tonly" id="studentLink">🧒 학생용 바로가기</button>
      <button class="tbtn sonly" id="teacherLink">🔑 교사용 바로가기</button>
      <button class="tbtn" id="fullBtn">⛶</button>
    </div>
  </div>
  <div id="panel"></div>
  <div id="banner" class="hide"><div id="who">이야기</div><button id="replay" title="다시 듣기">🔊 다시 듣기</button><div id="say"></div><div id="en"></div>
    <div id="nav"><button class="nbtn" id="prev" aria-label="이전">◀</button><button class="nbtn" id="next" aria-label="다음">▶</button></div></div>
  <div id="cover">
    <div class="info">3학년 영어 · Lesson 9 · What Color Is It? · 3차시</div>
    <h1>앨리스와 색깔 정원</h1>
    <div class="eng">Alice and the Color Garden</div>
    <button class="pbtn startbtn" id="startBtn">이야기 시작 ▶</button>
    <button class="pbtn soft" onclick="window.open('worksheet.html','_blank')" style="font-size:26px">🖨️ 학습지 인쇄하기 (PDF)</button>
  </div>
</div>
<div id="pass"><form id="passForm"><div>교사용 비밀번호</div><input id="passIn" type="password" inputmode="numeric" autocomplete="off"><button class="pbtn">들어가기</button> <button type="button" class="pbtn soft" id="passX">닫기</button><div id="passMsg" style="color:#c2187a;font-size:20px;margin-top:6px"></div></form></div>
<script>
const $=id=>document.getElementById(id);
// ---------- 화면 맞추기 ----------
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);$('stage').style.transform=`translate(-50%,-50%) scale(${s})`}addEventListener('resize',fit);fit();
// ---------- 모드 ----------
let mode=new URLSearchParams(location.search).get('mode')==='teacher'||sessionStorage.getItem('alice-mode')==='teacher'?'teacher':'student';
function setMode(m){mode=m;sessionStorage.setItem('alice-mode',m);document.body.className='mode-'+m}
setMode(mode);
$('teacherLink').onclick=()=>{$('pass').classList.add('on');$('passIn').value='';$('passMsg').textContent='';setTimeout(()=>$('passIn').focus(),50)};
$('passX').onclick=()=>$('pass').classList.remove('on');
$('passForm').onsubmit=e=>{e.preventDefault();if($('passIn').value.trim()==='0634'){$('pass').classList.remove('on');setMode('teacher')}else $('passMsg').textContent='비밀번호가 맞지 않아요.'};
$('studentLink').onclick=()=>setMode('student');
$('fullBtn').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};
$('toggleBanner').onclick=()=>$('banner').classList.toggle('hide');
// ---------- 소리 ----------
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC}
function chime(notes=[880,1175,1568],gap=.09,type='sine',vol=.12){try{const a=ac(),t=a.currentTime;notes.forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*gap);g.gain.exponentialRampToValueAtTime(vol,t+i*gap+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*gap+.6);o.connect(g).connect(a.destination);o.start(t+i*gap);o.stop(t+i*gap+.65)})}catch{}}
const sfx={ding:()=>chime([1046,1568]),win:()=>chime([784,988,1175,1568,2093],.08),page:()=>chime([660,880],.06,'triangle',.06),pop:()=>chime([520,1040],.05,'triangle',.1)};
let voices=[];function loadVoices(){voices=speechSynthesis.getVoices()}speechSynthesis.onvoiceschanged=loadVoices;loadVoices();
function voice(kind){const en=voices.filter(v=>/^en[-_](US|GB)/i.test(v.lang));if(kind==='girl')return en.find(v=>/female|samantha|zira|aria|jenny|google us english/i.test(v.name))||en[0];return en.find(v=>/male|daniel|david|guy|uk english male/i.test(v.name))||en[1]||en[0]}
async function speak(text,opt={}){const key=CLIP_EN[text];if(!opt.keep){speechSynthesis.cancel();stopAudio();readToken++}if(key){const ok=await playClip(key,opt.clipRate||1);if(ok)return}return ttsSpeak(text,opt)}
function ttsSpeak(text,{rate=.85,pitch=1.1,who='girl',keep=false}={}){return new Promise(res=>{try{const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;u.pitch=pitch;const v=voice(who);if(v)u.voice=v;u.onend=res;u.onerror=res;speechSynthesis.speak(u)}catch{res()}})}
const KO_VOICE={'이야기':{pitch:1,rate:1},'앨리스':{pitch:1.3,rate:1.05},'흰 토끼':{pitch:1.6,rate:1.15},'하트 여왕':{pitch:.75,rate:.95},'카드 정원사':{pitch:1.15,rate:1.1}};
function koVoice(){return voices.find(v=>/^ko/i.test(v.lang)&&/google/i.test(v.name))||voices.find(v=>/^ko/i.test(v.lang))}
function speakKo(text,who){return new Promise(res=>{try{const k=KO_VOICE[who]||KO_VOICE['이야기'];const u=new SpeechSynthesisUtterance(text.replace(/["“”]/g,''));u.lang='ko-KR';u.pitch=k.pitch;u.rate=k.rate;const v=koVoice();if(v)u.voice=v;u.onend=res;u.onerror=res;speechSynthesis.speak(u)}catch{res()}})}
let autoRead=localStorage.getItem('alice-auto')!=='off',readToken=0;
function autoUI(){$('autoBtn').textContent=autoRead?'🔊 자동 읽기 켬':'🔇 자동 읽기 끔'}autoUI();
$('autoBtn').onclick=()=>{autoRead=!autoRead;localStorage.setItem('alice-auto',autoRead?'on':'off');autoUI();if(!autoRead){readToken++;speechSynthesis.cancel()}else readStep()};
async function readStep(){const s=STEPS[step];if(!s)return;const my=++readToken;speechSynthesis.cancel();stopAudio();await new Promise(r=>setTimeout(r,350));if(my!==readToken)return;$('say').classList.add('reading');const ok=await playClip('n'+String(step+1).padStart(2,'0'));if(!ok&&my===readToken)await speakKo(s.say,s.who);$('say').classList.remove('reading');if(my!==readToken||!s.en)return;await new Promise(r=>setTimeout(r,250));if(my!==readToken)return;const boy=s.enWho==='boy';await speak(s.en,{who:s.enWho||'girl',pitch:boy?.95:1.15,rate:.85,keep:true})}
// ---------- 녹음 파일 ----------
const CLIP_EN={"Look! Look! I'm late!":'e_late',"What color is it?":'e_what',"It's blue. I like blue.":'e_like',"That's right! Thank you!":'e_right',"That's right! Thank you, everyone!":'e_right2',"Look! Look! Rabbit! Rabbit!":'readme',"It's purple.":'c_purple',"It's red.":'c_red',"It's green.":'c_green',"It's yellow.":'c_yellow',"It's blue.":'c_blue',"It's white.":'c_white',"Wow! A red rose!":'wow',"red and blue... purple!":'m_purple',"yellow and blue... green!":'m_green',"red and yellow... orange!":'m_orange',"l, l, look":'ch_look',"l, l, like":'ch_like',"r, r, red":'ch_red',"r, r, rabbit":'ch_rabbit',"look":'w_look',"like":'w_like',"red":'w_red',"rabbit":'w_rabbit',"D":'l_d',"H":'l_h',"Q":'l_q',"Y":'l_y'};
let curAudio=null;const audioCache={};
function clip(key){if(!audioCache[key]){const a=new Audio('audio/'+key+'.mp3');a.preload='auto';audioCache[key]=a}return audioCache[key]}
function stopAudio(){if(curAudio){curAudio.pause();curAudio=null}}
function playClip(key,rate=1){return new Promise(res=>{try{stopAudio();const a=clip(key);a.currentTime=0;a.playbackRate=rate;a.preservesPitch=false;curAudio=a;let done=false;const fin=ok=>{if(done)return;done=true;a.onended=a.onerror=null;res(ok)};a.onended=()=>fin(true);a.onerror=()=>fin(false);a.play().catch(()=>fin(false))}catch{res(false)}})}
// ---------- 장미 ----------
const ROSE_N=6;let roses=0;
function roseSVG(red){const c=red?'#e0193c':'#fdf7fb',d=red?'#8f0a22':'#c9b4c3',h=red?'#ff6b7e':'#ffffff';return `<svg class="rose" viewBox="0 0 48 48"><path d="M24 31 C24 38 23 43 23 47" stroke="#3f8f3a" stroke-width="3" fill="none"/><path d="M23 39 c-6 -3 -10 0 -11 3 c5 2 9 0 11 -3z" fill="#5bb04f"/><path d="M24 34 C12 34 8 24 12 16 C14 10 20 8 24 10 C28 8 34 10 36 16 C40 24 36 34 24 34Z" fill="${c}" stroke="${d}" stroke-width="2"/><path d="M14 18 C18 26 30 26 34 18" fill="none" stroke="${d}" stroke-width="2"/><path d="M24 22 C20 22 19 17 22 15 C25 13 29 16 27 19" fill="none" stroke="${d}" stroke-width="2"/><circle cx="19" cy="14" r="2" fill="${h}" opacity=".8"/></svg>`}
function drawRoses(popIdx=-1){const box=$('roses');box.innerHTML='<span>여왕의 장미</span>'+Array.from({length:ROSE_N},(_,i)=>roseSVG(i<roses)).join('');if(popIdx>=0)box.querySelectorAll('.rose')[popIdx]?.classList.add('got')}
const earned=new Set();
function earn(key){if(earned.has(key))return;earned.add(key);roses=Math.min(ROSE_N,roses+1);drawRoses(roses-1);sfx.win();sparkle($('roses'),24)}
function bloomAll(){let k=0;const t=setInterval(()=>{if(roses>=ROSE_N){clearInterval(t);return}roses++;drawRoses(roses-1);sfx.ding();sparkle($('roses'),12);k++},350)}
drawRoses();
function sparkle(el,n=18){const r=el.getBoundingClientRect(),st=$('stage').getBoundingClientRect(),s=st.width/1600;for(let i=0;i<n;i++){const p=document.createElement('div');p.className='spark';p.style.left=((r.left+r.width/2-st.left)/s)+'px';p.style.top=((r.top+r.height/2-st.top)/s)+'px';p.style.setProperty('--dx',(Math.random()-.5)*400+'px');p.style.setProperty('--dy',(Math.random()-.5)*300+'px');$('stage').append(p);setTimeout(()=>p.remove(),1300)}}

{bg:8,scene:'8. 색깔 정원',who:Q,say:'"모두 고맙구나! 아주 잘했어!"',en:"That's right! Thank you!",enWho:'boy'},
{bg:8,scene:'8. 색깔 정원',who:A,say:'"오늘 배운 말을 일기에 써 둘래요!"',act:diaryPanel,actName:'My ABC Diary'}];
let step=-1;
function go(i){i=Math.max(0,Math.min(STEPS.length-1,i));const s=STEPS[i];if(i!==step)sfx.page();step=i;speechSynthesis.cancel();showBg(s.bg);$('sceneChip').textContent=s.scene;$('who').innerHTML='<span class="we">'+({'이야기':'📖','앨리스':'👧','흰 토끼':'🐰','하트 여왕':'👑','카드 정원사':'🃏'}[s.who]||'✨')+'</span>'+s.who;$('say').textContent=s.say;const en=$('en');en.innerHTML='';if(s.en){const b=document.createElement('button');b.className='speak';b.textContent='🔊';b.onclick=()=>speak(s.en,{who:s.enWho||'girl',pitch:s.enWho==='boy'?.95:1.15});en.append(b,document.createTextNode(s.en))}$('banner').classList.remove('hide');$('prev').disabled=i===0;$('next').disabled=false;$('banner').classList.toggle('mini',!!s.act);if(s.act){$('actChip').style.display='';$('actChip').textContent='✏️ '+s.actName;s.act()}else{$('actChip').style.display='none';hidePanel()}if(s.onShow)s.onShow();readToken++;clip('n'+String(i+2).padStart(2,'0'));if(autoRead)readStep()}
$('replay').onclick=()=>readStep();
$('next').onclick=()=>{if(step>=STEPS.length-1)showEnd();else go(step+1)};$('prev').onclick=()=>go(step-1);
$('startBtn').onclick=()=>{ac();$('cover').remove();go(0);sfx.win()};
function showEnd(){if($('endScreen'))return;stopAudio();speechSynthesis.cancel();hidePanel();$('banner').classList.add('hide');bloomAll();const d=document.createElement('div');d.id='endScreen';d.innerHTML=`<div class="info">Alice and the Color Garden</div><h1>The End</h1><div class="eng">여왕의 정원에 장미가 활짝 피었어요! 🌹</div><div style="display:flex;gap:16px;margin-top:18px"><button class="pbtn" id="againBtn">↺ 처음부터 다시</button><button class="pbtn soft" id="backBtn">◀ 마지막 장면으로</button><button class="pbtn soft" onclick="window.open('worksheet.html','_blank')">🖨️ 학습지 인쇄</button></div>`;$('stage').append(d);sfx.win();for(let i=0;i<6;i++)setTimeout(()=>sparkle(d,40),i*300);playClip('e_right2');$('againBtn').onclick=()=>{d.remove();earned.clear();roses=0;drawRoses();go(0)};$('backBtn').onclick=()=>{d.remove();go(STEPS.length-1)}}
addEventListener('keydown',e=>{if($('pass').classList.contains('on')||['INPUT'].includes(e.target.tagName))return;if(!$('cover')&&(e.key==='ArrowRight'||e.key==='PageDown')){e.preventDefault();if($('endScreen'))return;if(step>=STEPS.length-1)showEnd();else go(step+1)}if(!$('cover')&&(e.key==='ArrowLeft'||e.key==='PageUp')){e.preventDefault();go(step-1)}if(e.key==='b'||e.key==='B')$('banner').classList.toggle('hide')});
</script>
